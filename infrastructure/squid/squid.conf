# Listener only on the Hermes-facing isolated network.
http_port 10.237.80.2:3128
visible_hostname hermes-dev-loop-squid
pid_filename /run/squid.pid
cache_effective_user proxy-runtime
cache_effective_group proxy-runtime
cache deny all
cache_mem 0 MB
cache_store_log none
cache_log /dev/stderr
logfile_rotate 0
# Exclude URLs, queries, bodies, headers and credentials from request logs.
logformat devloop %ts.%03tu %>a %rm %>Hs %Ss/%Sh %<a
access_log stdio:/dev/stdout devloop
forwarded_for delete
icp_port 0
htcp_port 0
snmp_port 0

acl hermes src 10.237.80.3/32
acl CONNECT method CONNECT
acl TLS_port port 443
acl approved dstdomain -n "/etc/squid/devloop/allowlist.txt"
acl prohibited dst "/etc/squid/devloop/prohibited-destinations.txt"

# HTTPS CONNECT only. No plain HTTP, cache manager, UDP, FTP or arbitrary ports.
http_access deny !hermes
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny !approved
# Resolve allowed hostnames too: defeats names pointing at private destinations.
http_access deny prohibited
http_access allow hermes approved
http_access deny all
